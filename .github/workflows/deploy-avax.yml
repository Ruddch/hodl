name: Deploy Avax

on:
  push:
    branches:
      - avax
  workflow_dispatch:

jobs:
  deploy-avax:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Clean previous build artifacts
        run: rm -rf out .next

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_ENV: development
          NEXT_PUBLIC_POSTHOG_TOKEN: ${{ secrets.POSTHOG_TOKEN }}

      - name: Create .nojekyll
        run: touch out/.nojekyll

      - name: Deploy to avax GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.AVAX_PAT }}
          repository-name: Ruddch/avaxH
          branch: gh-pages
          folder: out
          single-commit: true
          clean: true

name: Deploy to Dev

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Clean previous build
        run: rm -rf out .next

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_ENV: production
          NEXT_PUBLIC_POSTHOG_TOKEN: ${{ secrets.POSTHOG_TOKEN }}

      - name: Check build output
        run: |
          echo "Checking out directory..."
          ls -la out/ || echo "out directory not found!"
          if [ -f "out/index.html" ]; then
            echo "✓ index.html found"
            echo "--- First 30 lines of index.html ---"
            head -30 out/index.html
            echo ""
            echo "--- Checking for static files ---"
            ls -la out/_next/static/ 2>/dev/null || echo "No _next/static directory"
            find out -name "*.css" -o -name "*.js" | head -5
          else
            echo "✗ index.html NOT found!"
            find out -name "*.html" | head -5
          fi

      - name: Create .nojekyll file
        run: |
          touch out/.nojekyll
          echo ".nojekyll file created"
          ls -la out/.nojekyll || echo "WARNING: .nojekyll file not found!"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
